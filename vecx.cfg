# vecx configuration file
# All options correspond to the equivalent --option-name CLI flags.
# CLI flags always override values set here.

# ROM and cartridge files
rom=rom.dat
#cart=mygame.bin

# Overlay BMP image (optional)
#overlay=overlay.bmp

# Audio output device (default: system default)
# Run vecx to see the list of available devices printed at startup.
device=BlackHole 64ch

# PSG game audio channel assignments
audio-l=3
audio-r=4

# Laser XYZ channel assignments
laser-x=0
laser-y=1
laser-z=2

# Mirror the projected image (true/false, 1/0, yes/no)
laser-flip-x=false
laser-flip-y=true

# Use optimized scan mode: planner eliminates blank travel from output (true/false, 1/0, yes/no)
laser-optimized=true

# Buffer size in samples for laser output (power of 2)
# Increase if you experience audio underruns; decrease to reduce latency.
laser-buf-samples=16

# Minimum segment length filter (Vectrex units, Manhattan |dx|+|dy|).
# Segments shorter than this value are skipped in optimized mode.
# Useful to suppress single-pixel dots. 0 = disabled (default).
# Screen width is ~33000 units; try values like 100-500 to start.
#laser-min-seg-len=10
