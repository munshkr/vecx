# vecx configuration file
# All options correspond to the equivalent --option-name CLI flags.
# CLI flags always override values set here.

# ROM and cartridge files
rom=rom.dat
#cart=mygame.bin

# Overlay BMP image (optional)
#overlay=overlay.bmp

# Audio output device (default: system default)
# Run vecx to see the list of available devices printed at startup.
#device=BlackHole 64ch

# PSG game audio channel assignments
audio-l=0
audio-r=1

# Laser XYZ channel assignments
laser-x=2
laser-y=3
laser-z=4

# Mirror the projected image (true/false, 1/0, yes/no)
laser-flip-x=false
laser-flip-y=false
